# Railway PostgreSQL Database Configuration (Fixed URL)
spring.datasource.url=jdbc:postgresql://postgres-production-bdab.up.railway.app:5432/railway?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=qiBGElWVIhidsqGCeOanzEOCxocOJtiv
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (penting untuk cloud deployment)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false

# Server Configuration
server.port=8080

# Logging Configuration (matikan untuk production)
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.com.zaxxer.hikari=DEBUG